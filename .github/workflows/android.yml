name: Build Android Expo

on:
  push:
    branches: []
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'build-android') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          echo "storeFile=keystore.jks" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties

      - name: Fix release signing config
        run: |
          python3 - <<'EOF'
          content = open('android/app/build.gradle').read()

          release_config = '''        release {
                  def keystoreProperties = new Properties()
                  keystoreProperties.load(new FileInputStream(rootProject.file("key.properties")))
                  storeFile file(keystoreProperties["storeFile"])
                  storePassword keystoreProperties["storePassword"]
                  keyAlias keystoreProperties["keyAlias"]
                  keyPassword keystoreProperties["keyPassword"]
              }'''

          content = content.replace('signingConfigs {\n        debug {', 'signingConfigs {\n' + release_config + '\n        debug {')
          content = content.replace('signingConfig signingConfigs.debug\n            def enableShrinkResources', 'signingConfig signingConfigs.release\n            def enableShrinkResources')

          open('android/app/build.gradle', 'w').write(content)
          print("Done! Release signing config added.")
          EOF

      - name: Verify keystore SHA1
        run: |
          keytool -list -v -keystore android/app/keystore.jks \
            -storepass ${{ secrets.ANDROID_STORE_PASSWORD }} | grep SHA1

      - name: Build Android Bundle
        run: cd android && ./gradlew bundleRelease --info 2>&1 | grep -A 20 "FAILED\|Error\|error:" | head -80

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upload to S3
        run: |
          BUILD_FILE="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="android/app/build/outputs/apk/release/app-release.apk"
          fi

          if [ -f "$BUILD_FILE" ]; then
            aws s3 cp "$BUILD_FILE" s3://${{ secrets.S3_BUCKET_NAME }}/expo-app/mobile/app-latest.aab
            
            TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
            aws s3 cp "$BUILD_FILE" s3://${{ secrets.S3_BUCKET_NAME }}/expo-app/mobile/backups/app-$TIMESTAMP.aab
            
            echo "📦 App URL (Latest): https://${{ secrets.S3_BUCKET_NAME }}.s3.amazonaws.com/expo-app/mobile/app-latest.aab"
            echo "📦 App URL (Backup): https://${{ secrets.S3_BUCKET_NAME }}.s3.amazonaws.com/expo-app/mobile/backups/app-$TIMESTAMP.aab"
          else
            echo "❌ Build artifact not found"
            exit 1
          fi

      - name: Upload build artifacts to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/app/build/outputs/
          retention-days: 30
